name: Build & Package iOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build SmartLedger iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15/16
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          else
            sudo xcode-select -r
          fi
          xcodebuild -version

      - name: Build Application for iOS Simulator
        run: |
          mkdir -p build/Release-iphonesimulator
          xcodebuild build \
            -project SmartLedger.xcodeproj \
            -scheme SmartLedger \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphonesimulator"

      - name: Package App Bundle for Download
        run: |
          cd build/Release-iphonesimulator
          zip -r -X ../../SmartLedger-iOS-Simulator-App.zip SmartLedger.app
          ls -la ../../SmartLedger-iOS-Simulator-App.zip

      - name: Upload Built iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-iOS-Simulator-App
          path: SmartLedger-iOS-Simulator-App.zip
          retention-days: 14
