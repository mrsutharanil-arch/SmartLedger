name: Backend CI & Health Test

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Backend/**'

jobs:
  test-backend:
    name: Test FastAPI & Gemini Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Initialization & Database
        run: |
          cd Backend
          python -c "from app.main import app; from app.database import init_db; init_db(); print('Backend initialized successfully!')"
