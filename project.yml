name: SmartLedger
options:
  bundleIdPrefix: com.smartledger
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  SmartLedger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SmartLedger
        excludes:
          - "Info.plist"
    info:
      path: SmartLedger/Info.plist
      properties:
        CFBundleDisplayName: SmartLedger
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: SmartLedger
        PRODUCT_BUNDLE_IDENTIFIER: com.smartledger.app
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SmartLedger/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1" # iPhone
